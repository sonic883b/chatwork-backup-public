name: Chatwork backup to Google Drive

on:
  # This is the portfolio/template copy: the schedule trigger is disabled
  # so it doesn't run (and fail on missing secrets) unattended. Uncomment
  # it once real secrets are configured on this repo.
  # schedule:
  #   - cron: "0 22 * * *"  # 07:00 JST daily
  workflow_dispatch: {}

# State lives on Google Drive (see src/main.py), not in this repo, so the
# workflow never needs write access to repo contents.
permissions:
  contents: read

concurrency:
  group: chatwork-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run backup
        working-directory: src
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python main.py
