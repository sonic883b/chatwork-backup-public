name: Chatwork backup to Google Drive

on:
  schedule:
    - cron: "0 22 * * *"  # 07:00 JST daily
  workflow_dispatch: {}

# State lives on Google Drive (see src/main.py), not in this repo, so the
# workflow never needs write access to repo contents.
permissions:
  contents: read

concurrency:
  group: chatwork-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run backup
        working-directory: src
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python main.py
