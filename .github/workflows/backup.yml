name: Chatwork backup to Google Drive

on:
  # This is the portfolio/template copy: the schedule trigger is disabled
  # so it doesn't run (and fail on missing secrets) unattended. Uncomment
  # it once real secrets are configured on this repo.
  # schedule:
  #   - cron: "0 22 * * *"  # 07:00 JST daily
  workflow_dispatch: {}

# State lives on Google Drive (see src/main.py), not in this repo, so the
# workflow never needs write access to repo contents.
permissions:
  contents: read

concurrency:
  group: chatwork-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run backup
        working-directory: src
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python main.py
